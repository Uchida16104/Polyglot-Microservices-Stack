[package]
name = "polyglot-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "polyglot-backend"
path = "src/main.rs"

[dependencies]
actix-web  = "4"
actix-cors = "0.7"
actix-rt   = "2"
tokio      = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest    = { version = "0.12", features = ["json", "rustls-tls"] }
env_logger = "0.11"
log        = "0.4"
anyhow     = "1"
chrono     = { version = "0.4", features = ["serde"] }
uuid       = { version = "1",   features = ["v4"] }
dotenvy    = "0.15"

[profile.release]
opt-level = 3
lto       = true
