name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/polyglot

jobs:
  test-laravel:
    name: Test Laravel Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/laravel-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, zip
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Copy env
        run: cp .env.example .env && php artisan key:generate

  test-rust:
    name: Test Rust Core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rust-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Format check
        run: cargo fmt --check
      - name: Build
        run: cargo build --release

  test-csharp:
    name: Test C# Business Logic
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/csharp-business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release

  test-python-ml:
    name: Test Python ML Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/python-ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile app/main.py app/database.py app/models_db.py app/worker.py

  test-research-runtimes:
    name: Test Research Runtimes Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/research-runtimes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile app/main.py app/database.py app/models_db.py app/worker.py app/compiler.py

  test-frontend:
    name: Test SvelteKit Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-laravel, test-rust, test-csharp, test-python-ml, test-research-runtimes, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: laravel-gateway
            context: services/laravel-gateway
          - name: rust-core
            context: services/rust-core
          - name: csharp-business
            context: services/csharp-business
          - name: python-ml
            context: services/python-ml
          - name: research-runtimes
            context: services/research-runtimes
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-render:
    name: Deploy Services to Render
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hooks
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_LARAVEL }}" &
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_RUST }}" &
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_CSHARP }}" &
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PYTHON }}" &
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_RESEARCH }}" &
          wait
