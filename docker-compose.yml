version: '3.9'

services:
  postgres:
    image: cockroachdb/cockroach:latest-v23.1
    command: start-single-node --insecure --advertise-addr=localhost
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: cockroachdb/cockroach:latest-v23.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint: >
      sh -c "
        cockroach sql --insecure --host=postgres:26257 -e 'CREATE DATABASE IF NOT EXISTS polyglot;' &&
        for f in /migrations/*.sql; do
          echo \"Applying $$f\";
          cockroach sql --insecure --host=postgres:26257 --database=polyglot < $$f;
        done
      "

  laravel-gateway:
    build:
      context: services/laravel-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: services/laravel-gateway/.env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - RUST_CORE_URL=http://rust-core:8001
      - CSHARP_BUSINESS_URL=http://csharp-business:8002
      - PYTHON_ML_URL=http://python-ml:8003
      - RESEARCH_RUNTIMES_URL=http://research-runtimes:8004
    depends_on:
      - postgres
      - redis

  rust-core:
    build:
      context: services/rust-core
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://root@postgres:26257/polyglot?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - PORT=8001
    depends_on:
      - postgres
      - redis

  csharp-business:
    build:
      context: services/csharp-business
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=26257;Database=polyglot;Username=root;SSL Mode=Disable
      - PORT=8002
    depends_on:
      - postgres

  python-ml:
    build:
      context: services/python-ml
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://root@postgres:26257/polyglot
      - REDIS_URL=redis://redis:6379
      - PORT=8003
      - ENV=development
    depends_on:
      - postgres
      - redis

  research-runtimes:
    build:
      context: services/research-runtimes
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://root@postgres:26257/polyglot
      - REDIS_URL=redis://redis:6379
      - PORT=8004
      - ENV=development
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: services/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - laravel-gateway

volumes:
  cockroach-data:
