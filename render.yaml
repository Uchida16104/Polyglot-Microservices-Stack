services:
  - type: web
    name: polyglot-backend
    runtime: rust
    rootDir: backend/rust-actix
    buildCommand: bash build.sh
    startCommand: ./target/release/polyglot-backend
    envVars:
      - key: RUST_LOG
        value: info
      - key: PORT
        value: "8080"
      - key: PYTHON_FASTAPI_URL
        fromService:
          name: python-fastapi
          type: web
          property: url
      - key: ZIG_PATH
        value: /opt/render/project/zig/zig
      - key: DOTNET_PATH
        value: /opt/render/project/dotnet/dotnet
      - key: DOTNET_ROOT
        value: /opt/render/project/dotnet
      - key: DOTNET_NOLOGO
        value: "1"
      - key: DOTNET_CLI_TELEMETRY_OPTOUT
        value: "1"
    healthCheckPath: /health

  - type: web
    name: python-fastapi
    runtime: python
    rootDir: backend/python-fastapi
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
    healthCheckPath: /health
